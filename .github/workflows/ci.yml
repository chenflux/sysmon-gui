name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: go build ./...
      - name: Vet (changed packages, sysmon vet has known legacy warnings)
        run: go vet ./internal/api/ ./internal/events/ ./internal/geoip/ ./internal/version/
      - name: Test
        run: go test ./internal/... -count=1
      - name: JS syntax check
        run: node --check web/app.js
